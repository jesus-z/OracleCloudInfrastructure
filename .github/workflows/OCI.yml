name: OCI Terraform
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Planificar o aplicar
        type: choice
        default: plan
        options: [plan, apply]
permissions:
  contents: read
concurrency:
  group: oci-terraform-lab
  cancel-in-progress: false
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_OCID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Configurar OCI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
        run: |
          set -euo pipefail
          for value in "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$OCI_TENANCY_OCID" "$OCI_KEY_FILE" "$TF_VAR_compartment_id"; do
            test -n "$value" || { echo 'Falta un secreto requerido'; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_KEY_FILE" > "$HOME/.oci/key.pem"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\nregion=sa-saopaulo-1\ntenancy=%s\nkey_file=%s\n' \
            "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$OCI_TENANCY_OCID" "$HOME/.oci/key.pem" > "$HOME/.oci/config"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -input=false -out=deployment.tfplan
      - name: Aplicar
        if: inputs.operation == 'apply'
        run: terraform apply -input=false deployment.tfplan
      - name: Limpiar credenciales
        if: always()
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config" deployment.tfplan

